name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes about 20 seconds; a hung worker should not hold a runner for 6 hours.
    timeout-minutes: 10
    steps:
      # Pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc # Netlify reads the same file
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
